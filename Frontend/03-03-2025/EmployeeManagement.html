<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Employee Management Application</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <style>
      :root {
        --primary: #2c3e50;
        --secondary: #3498db;
        --light: #ecf0f1;
        --dark: #2c3e50;
        --success: #2ecc71;
        --danger: #e74c3c;
        --text: #333;
        --shadow: rgba(0, 0, 0, 0.05);
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f9f9f9;
        color: var(--text);
        line-height: 1.6;
      }

      .container {
        max-width: 1200px;
        margin: 0 auto;
        padding: 0 20px;
      }

      .header {
        background-color: white;
        box-shadow: 0 2px 10px var(--shadow);
        padding: 20px 0;
        position: sticky;
        top: 0;
        z-index: 100;
      }

      h1 {
        color: var(--primary);
        text-align: center;
        font-weight: 600;
        margin-bottom: 5px;
        font-size: 32px;
      }

      .subtitle {
        font-size: 16px;
        color: #7f8c8d;
        text-align: center;
        margin-bottom: 20px;
        display: block;
      }

      nav {
        background-color: var(--primary);
        border-radius: 8px;
        margin: 20px auto;
        max-width: 900px;
      }

      nav ul {
        list-style-type: none;
        padding: 0;
        margin: 0;
        display: flex;
        justify-content: space-around;
        align-items: center;
      }

      nav ul li {
        margin: 0;
        position: relative;
      }

      nav ul li a {
        display: block;
        padding: 15px 20px;
        color: white;
        text-decoration: none;
        font-weight: 500;
        transition: all 0.3s ease;
        border-radius: 8px;
      }

      nav ul li a:hover {
        background-color: var(--secondary);
      }

      nav ul li a.active {
        background-color: var(--secondary);
        font-weight: 600;
      }

      .content {
        padding: 30px 0;
        max-width: 800px;
        margin: 0 auto;
      }

      .panel {
        background-color: white;
        border-radius: 8px;
        box-shadow: 0 4px 6px var(--shadow);
        padding: 25px;
        margin-bottom: 30px;
        transition: all 0.3s ease;
      }

      h2 {
        color: var(--primary);
        margin-bottom: 20px;
        font-weight: 600;
        font-size: 24px;
        border-bottom: 2px solid var(--light);
        padding-bottom: 10px;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }

      label {
        font-weight: 500;
        color: #555;
        margin-bottom: 5px;
        display: block;
      }

      input[type="text"],
      input[type="number"],
      input[type="date"],
      select {
        padding: 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        width: 100%;
        font-size: 16px;
        transition: all 0.3s ease;
      }

      input:focus {
        outline: none;
        border-color: var(--secondary);
        box-shadow: 0 0 0 2px rgba(52, 152, 219, 0.2);
      }

      .buttons {
        display: flex;
        gap: 12px;
        margin-top: 10px;
      }

      button {
        padding: 12px 20px;
        background-color: var(--secondary);
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 500;
        font-size: 16px;
        transition: all 0.3s ease;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      button:hover {
        background-color: #2980b9;
        transform: translateY(-2px);
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }

      button[type="reset"] {
        background-color: #95a5a6;
      }

      button[type="reset"]:hover {
        background-color: #7f8c8d;
      }

      button.delete {
        background-color: var(--danger);
      }

      button.delete:hover {
        background-color: #c0392b;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        border-radius: 8px;
        overflow: hidden;
        box-shadow: 0 4px 6px var(--shadow);
        margin-top: 20px;
      }

      th {
        background-color: var(--primary);
        color: white;
        padding: 15px;
        text-align: left;
        font-weight: 600;
      }

      td {
        padding: 15px;
        border-bottom: 1px solid #eee;
      }

      tr:nth-child(even) {
        background-color: #f8f9fa;
      }

      tr:hover {
        background-color: #f1f1f1;
      }

      .active {
        display: block;
      }

      .inactive {
        display: none;
      }

      .empty-state {
        text-align: center;
        padding: 40px 0;
        color: #7f8c8d;
      }

      .alert {
        padding: 15px;
        margin-bottom: 20px;
        border-radius: 6px;
        text-align: center;
      }

      .alert-success {
        background-color: #d5f5e3;
        color: #27ae60;
        border: 1px solid #2ecc71;
      }

      .alert-error {
        background-color: #fadbd8;
        color: #c0392b;
        border: 1px solid #e74c3c;
      }

      @media (max-width: 768px) {
        nav ul {
          flex-direction: column;
          padding: 10px;
        }

        nav ul li {
          width: 100%;
          margin-bottom: 5px;
        }

        nav ul li a {
          text-align: center;
        }

        .buttons {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div class="header">
      <div class="container">
        <h1>Employee Management Application</h1>
        <span class="subtitle">Manage employees, view reports, and more</span>
        <nav>
          <ul>
            <li>
              <a href="#add" class="active"
                ><i class="fas fa-user-plus"></i> Add Employee</a
              >
            </li>
            <li>
              <a href="#list" onclick="displayAll()"
                ><i class="fas fa-list"></i> List All</a
              >
            </li>
            <li>
              <a href="#search"><i class="fas fa-search"></i> Search</a>
            </li>
            <li>
              <a href="#update"><i class="fas fa-user-edit"></i> Update</a>
            </li>
            <li>
              <a href="#delete"><i class="fas fa-user-minus"></i> Delete</a>
            </li>
          </ul>
        </nav>
      </div>
    </div>

    <div class="container">
      <div class="content">
        <div id="add" class="panel active">
          <h2><i class="fas fa-user-plus"></i> Add Employee</h2>
          <form id="addForm">
            <div>
              <label for="name">Full Name</label>
              <input
                type="text"
                id="name"
                name="name"
                placeholder="Enter employee name"
                required
              />
            </div>
            <div>
              <label for="age">Age</label>
              <input
                type="number"
                id="age"
                name="age"
                placeholder="Enter employee age"
                required
              />
            </div>
            <div>
              <label for="department">Department</label>
              <input
                type="text"
                id="department"
                name="department"
                placeholder="Enter department"
                required
              />
            </div>
            <div class="buttons">
              <button type="button" onclick="addEmployee()">
                <i class="fas fa-plus-circle"></i> Add Employee
              </button>
              <button type="reset"><i class="fas fa-undo"></i> Reset</button>
            </div>
          </form>
          <div id="addMessage"></div>
        </div>

        <div id="list" class="panel inactive">
          <h2><i class="fas fa-list"></i> Employee List</h2>
          <div id="employeeList">
            <div class="empty-state">
              <i
                class="fas fa-users"
                style="font-size: 48px; margin-bottom: 15px; color: #bdc3c7"
              ></i>
              <p>
                No employees added yet. Add some employees to see them here.
              </p>
            </div>
          </div>
        </div>

        <div id="search" class="panel inactive">
          <h2><i class="fas fa-search"></i> Search Employee</h2>
          <form id="searchForm">
            <div>
              <label for="searchId">Employee ID</label>
              <input
                type="number"
                id="searchId"
                name="id"
                placeholder="Enter employee ID"
                required
              />
            </div>
            <div class="buttons">
              <button type="button" onclick="searchEmployee()">
                <i class="fas fa-search"></i> Search
              </button>
              <button type="reset" onclick="clearSearchResults()">
                <i class="fas fa-undo"></i> Reset
              </button>
            </div>
          </form>
          <div id="searchResults"></div>
        </div>

        <div id="update" class="panel inactive">
          <h2><i class="fas fa-user-edit"></i> Update Employee</h2>
          <form id="updateForm">
            <div>
              <label for="updateId">Employee ID</label>
              <input
                type="number"
                id="updateId"
                name="id"
                placeholder="Enter employee ID"
                required
              />
            </div>
            <div>
              <label for="updateName">Full Name</label>
              <input
                type="text"
                id="updateName"
                name="name"
                placeholder="Enter new name"
                required
              />
            </div>
            <div>
              <label for="updateAge">Age</label>
              <input
                type="number"
                id="updateAge"
                name="age"
                placeholder="Enter new age"
                required
              />
            </div>
            <div>
              <label for="updateDepartment">Department</label>
              <input
                type="text"
                id="updateDepartment"
                name="department"
                placeholder="Enter new department"
                required
              />
            </div>
            <div class="buttons">
              <button type="button" onclick="updateEmployee()">
                <i class="fas fa-save"></i> Update Employee
              </button>
              <button type="reset"><i class="fas fa-undo"></i> Reset</button>
            </div>
          </form>
          <div id="updateMessage"></div>
        </div>

        <div id="delete" class="panel inactive">
          <h2><i class="fas fa-user-minus"></i> Delete Employee</h2>
          <form id="deleteForm">
            <div>
              <label for="deleteId">Employee ID</label>
              <input
                type="number"
                id="deleteId"
                name="id"
                placeholder="Enter employee ID"
                required
              />
            </div>
            <div class="buttons">
              <button type="button" class="delete" onclick="deleteEmployee()">
                <i class="fas fa-trash-alt"></i> Delete Employee
              </button>
              <button type="reset"><i class="fas fa-undo"></i> Reset</button>
            </div>
          </form>
          <div id="deleteMessage"></div>
        </div>
      </div>
    </div>

    <script>
      const navLinks = document.querySelectorAll("nav ul li a");
      navLinks.forEach((link) => {
        link.addEventListener("click", (e) => {
          e.preventDefault();
          navLinks.forEach((link) => {
            link.classList.remove("active");
          });
          link.classList.add("active");
          const targetId = link.getAttribute("href");
          const allContent = document.querySelectorAll(".panel");
          allContent.forEach((div) => {
            div.classList.remove("active");
            div.classList.add("inactive");
          });
          const targetPanel = document.querySelector(targetId);
          targetPanel.classList.add("active");
          targetPanel.classList.remove("inactive");
        });
      });

      class Employee {
        constructor(id, name, age, department) {
          this.id = id;
          this.name = name;
          this.age = age;
          this.department = department;
        }
      }

      let empArr = [];

      function createAlert(message, type, container) {
        const alertDiv = document.createElement("div");
        alertDiv.className = `alert alert-${type}`;
        alertDiv.innerHTML = message;

        // Clear previous alerts
        container.innerHTML = "";
        container.appendChild(alertDiv);

        // Auto remove after 3 seconds
        setTimeout(() => {
          alertDiv.remove();
        }, 3000);
      }

      function addEmployee() {
        const name = document.getElementById("name").value;
        const age = parseInt(document.getElementById("age").value);
        const department = document.getElementById("department").value;

        if (!name || !age || !department) {
          createAlert(
            "Please fill all fields",
            "error",
            document.getElementById("addMessage")
          );
          return;
        }
        if (empArr.length == 0) var id = 1;
        else var id = empArr[empArr.length - 1].id + 1;
        empArr.push(new Employee(id, name, age, department));
        console.log(empArr);

        document.getElementById("addForm").reset();
        createAlert(
          "Employee has been added successfully!",
          "success",
          document.getElementById("addMessage")
        );
      }

      function displayAll() {
        let listDisplay = document.getElementById("employeeList");

        if (empArr.length === 0) {
          listDisplay.innerHTML = `
            <div class="empty-state">
              <i class="fas fa-users" style="font-size: 48px; margin-bottom: 15px; color: #bdc3c7;"></i>
              <p>No employees added yet. Add some employees to see them here.</p>
            </div>
          `;
          return;
        }

        listDisplay.innerHTML = `
          <table>
            <thead>
              <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Department</th>
              </tr>
            </thead>
            <tbody>
              ${empArr
                .map(
                  (emp) => `
                  <tr>
                    <td>${emp.id}</td>
                    <td>${emp.name}</td>
                    <td>${emp.age}</td>
                    <td>${emp.department}</td>
                  </tr>
                  `
                )
                .join("")}
            </tbody>
          </table>
        `;
      }

      function clearSearchResults() {
        document.getElementById("searchResults").innerHTML = "";
      }

      function searchEmployee() {
        const id = parseInt(document.getElementById("searchId").value);
        const searchResults = document.getElementById("searchResults");

        if (!id) {
          createAlert("Please enter an ID", "error", searchResults);
          return;
        }

        const foundEmployee = empArr.find((emp) => emp.id === id);

        if (foundEmployee) {
          searchResults.innerHTML = `
            <h3 style="margin-top: 20px; color: var(--primary);">Search Results</h3>
            <table>
              <thead>
                <tr>
                  <th>ID</th>
                  <th>Name</th>
                  <th>Age</th>
                  <th>Department</th>
                </tr>
              </thead>
              <tbody>
                <tr>
                  <td>${foundEmployee.id}</td>
                  <td>${foundEmployee.name}</td>
                  <td>${foundEmployee.age}</td>
                  <td>${foundEmployee.department}</td>
                </tr>
              </tbody>
            </table>
          `;
        } else {
          createAlert("No employee found with that ID", "error", searchResults);
        }
      }

      function updateEmployee() {
        const id = parseInt(document.getElementById("updateId").value);
        const name = document.getElementById("updateName").value;
        const age = parseInt(document.getElementById("updateAge").value);
        const department = document.getElementById("updateDepartment").value;
        const updateMessage = document.getElementById("updateMessage");

        if (!id || !name || !age || !department) {
          createAlert("Please fill all fields", "error", updateMessage);
          return;
        }

        const foundEmployee = empArr.find((emp) => emp.id === id);

        if (foundEmployee) {
          foundEmployee.name = name;
          foundEmployee.age = age;
          foundEmployee.department = department;
          console.log(empArr);

          document.getElementById("updateForm").reset();
          createAlert(
            "Employee updated successfully!",
            "success",
            updateMessage
          );
        } else {
          createAlert("No employee found with that ID", "error", updateMessage);
        }
      }

      function deleteEmployee() {
        const id = parseInt(document.getElementById("deleteId").value);
        const deleteMessage = document.getElementById("deleteMessage");

        if (!id) {
          createAlert("Please enter an ID", "error", deleteMessage);
          return;
        }

        const foundEmployeeIndex = empArr.findIndex((emp) => emp.id === id);

        if (foundEmployeeIndex !== -1) {
          empArr.splice(foundEmployeeIndex, 1);
          console.log(empArr);

          document.getElementById("deleteForm").reset();
          createAlert(
            "Employee deleted successfully!",
            "success",
            deleteMessage
          );
        } else {
          createAlert("No employee found with that ID", "error", deleteMessage);
        }
      }
    </script>
  </body>
</html>
